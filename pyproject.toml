[project]
name = "llm4rec-bias-Integrated"
version = "1.0.0"
description = "统一框架：MiniOneRec / Rec-R1 / DPO4Rec 三条 LLM4Rec 路线上的 RL bias 放大研究"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm4rec = "llm4rec.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm4rec"]

[tool.hatch.build.targets.wheel.sources]
"src/llm4rec" = "llm4rec"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
