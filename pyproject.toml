[project]
name = "llm4rec-bias-Integrated"
version = "0.2.0"
description = "Modular LLM4Rec Research Framework (MiniOneRec / MLLM4Rec / GRPO4Rec)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm4rec-bias-Integrated = "llm4rec.cli.main:main"
llm4rec = "llm4rec.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm4rec", "src/llm4rec_bias_Integrated"]

[tool.hatch.build.targets.wheel.sources]
"src/llm4rec" = "llm4rec"
"src/llm4rec_bias_Integrated" = "llm4rec_bias_Integrated"

[tool.hatch.build.targets.wheel.force-include]
"src/llm4rec/workflows/mllm4rec/_stack/templates/alpaca_short.json" = "llm4rec/workflows/mllm4rec/_stack/templates/alpaca_short.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
