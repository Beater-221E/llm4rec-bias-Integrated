[project]
name = "llm4rec-bias-Integrated"
version = "0.1.0"
description = "Config-driven LLM4Rec framework (SFT / GRPO / eval / bias probes)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm4rec-bias-Integrated = "llm4rec_bias_Integrated.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm4rec_bias_Integrated"]

[tool.hatch.build.targets.wheel.sources]
"src/llm4rec_bias_Integrated" = "llm4rec_bias_Integrated"

[tool.hatch.build.targets.wheel.force-include]
"src/llm4rec_bias_Integrated/mllm4rec/templates/alpaca_short.json" = "llm4rec_bias_Integrated/mllm4rec/templates/alpaca_short.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
