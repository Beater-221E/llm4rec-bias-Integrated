# =============================================================================
# llm4rec-bias-Integrated — 统一配置
# =============================================================================
# 结构：全局公共项 → 三条路线（grpo4rec / minionerec / mllm4rec）
# 每条路线内再按训练阶段分块（prepare / sft / grpo / evaluate / …）
#
# 用法：
#   workflow=grpo4rec scale=smoke hardware=single
#   experiment=smoke_grpo          # 等价于上面 + 冒烟预设
#   experiment=smoke_sid
#   --config mllm4rec.retriever    # 或 mllm4rec_retriever
# =============================================================================

# —— 全局 ——
experiment:
  name: default
  seed: 42
seed: 42

paths:
  data_root: data
  raw_dir: data/raw
  processed_dir: data/processed
  cache_dir: data/cache
  runs_dir: runs
  reports_dir: reports

# LLM 权重别名（各路线 model.name 解析用）
models:
  qwen2.5-0.5b-instruct: {checkpoint: Qwen/Qwen2.5-0.5B-Instruct}
  qwen2.5-1.5b-instruct: {checkpoint: Qwen/Qwen2.5-1.5B-Instruct}
  qwen2.5-3b-instruct: {checkpoint: Qwen/Qwen2.5-3B-Instruct}
  qwen2.5-7b-instruct: {checkpoint: Qwen/Qwen2.5-7B-Instruct}
  qwen2.5-0.5b: {checkpoint: Qwen/Qwen2.5-0.5B-Instruct}
  qwen2.5-1b: {checkpoint: Qwen/Qwen2.5-1.5B-Instruct}
  qwen2.5-1.5b: {checkpoint: Qwen/Qwen2.5-1.5B-Instruct}
  qwen2.5-3b: {checkpoint: Qwen/Qwen2.5-3B-Instruct}
  qwen2.5-7b: {checkpoint: Qwen/Qwen2.5-7B-Instruct}
  qwen25_0_5b: {checkpoint: Qwen/Qwen2.5-0.5B-Instruct}
  qwen25_3b: {checkpoint: Qwen/Qwen2.5-3B-Instruct}

tracking:
  console: true
  jsonl: true
  tensorboard: false
  wandb: false

# 硬件（hardware=single|multi）
hardware_profiles:
  single:
    hardware:
      name: single
      cuda_visible_devices: "0"
      mllm_cuda_visible_devices: "0"
      env: {}
    training: {distributed: single, auto_launch_multi_gpu: false}
  multi:
    hardware:
      name: multi
      cuda_visible_devices: "0,1,2,3"
      mllm_cuda_visible_devices: "0"
      env:
        NCCL_P2P_DISABLE: "1"
        NCCL_IB_DISABLE: "1"
        NCCL_NVML_ENABLE: "0"
        TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    training: {distributed: auto, auto_launch_multi_gpu: true}

# =============================================================================
# 路线 1：grpo4rec（Letter 候选选择：SFT → GRPO → eval / probes）
# =============================================================================
grpo4rec:
  workflow:
    name: grpo4rec
    task: candidate_choice

  # 路线级默认（各阶段共用）
  dataset:
    name: movielens_100k
    rating_threshold: 4.0
    split: leave_one_out
    history_max_length: 20
    candidate_size: 10
    negative_sampling: uniform
    target_position: random
    framing: neutral
    min_user_interactions: 5
    train_limit: null
    eval_limit: null

  model:
    name: qwen2.5-0.5b-instruct
    checkpoint: Qwen/Qwen2.5-0.5B-Instruct
    dtype: float16
    use_flash_attention: false
    gradient_checkpointing: true
    trust_remote_code: false

  peft:
    enabled: true
    method: lora
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]

  # —— 训练阶段 ——
  prepare: {}

  sft:
    training:
      stages: [sft]
      batch_size: 4
      gradient_accumulation_steps: 4
      learning_rate: 0.0002
      epochs: 2
      eval_steps: 100
      save_steps: 100
      logging_steps: 10
      max_seq_length: 1024
      disable_tqdm: false

  grpo:
    training:
      stages: [grpo]
      batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 0.00005
      epochs: 1
      eval_steps: 50
      save_steps: 50
      logging_steps: 5
      max_seq_length: 1024
    grpo:
      num_generations: 8
      beta: 0.04
      max_prompt_length: 1024
      max_completion_length: 64
      temperature: 1.0
      top_p: 1.0
      advantage_normalization: group
      invalid_penalty: -0.5
      reward_weights:
        exact_match: 1.0
        format_validity: 0.2
        rank_aware: 0.5
        semantic_prefix: 0.0
        popularity_penalty: 0.0
    reward:
      name: default
      components: [exact_match, format_validity]
      weights: {exact_match: 1.0, format_validity: 0.2}

  evaluate:
    evaluation:
      name: ranking
      top_k: [1, 5, 10]
      metrics: [hr, recall, ndcg, mrr]
      use_upstream_eval: true
      max_examples: null

  analyze:
    bias:
      name: default
      probes: [popularity, position, framing, recency]

  # —— 规模预设（scale=smoke|full 或 experiment=smoke_*）——
  smoke:
    dataset:
      history_max_length: 8
      train_limit: 64
      eval_limit: 32
    peft: {rank: 8, alpha: 16, target_modules: [q_proj, v_proj]}
    sft:
      training:
        batch_size: 1
        gradient_accumulation_steps: 1
        learning_rate: 0.0001
        epochs: 1
        max_steps: 4
        eval_steps: 4
        save_steps: 4
        logging_steps: 1
        max_seq_length: 512
    grpo:
      training:
        batch_size: 1
        prompts_per_step: 1
        gradient_accumulation_steps: 1
        max_steps: 4
        eval_steps: 4
        save_steps: 4
        logging_steps: 1
        max_seq_length: 512
      grpo:
        num_generations: 2
        prompts_per_step: 1
        max_completion_length: 8
        max_steps: 4
        learning_rate: 0.000005
        reward_weights:
          exact_match: 1.0
          format_validity: 0.2
          rank_aware: 0.0
          popularity_penalty: 0.0
    evaluate:
      evaluation: {max_examples: null}
    analyze:
      bias: {max_examples: 16}

  full:
    dataset: {train_limit: null, eval_limit: null}
    sft:
      training: {max_steps: null, epochs: 1, logging_steps: 50, eval_steps: 500, save_steps: 500}
    grpo:
      grpo: {max_steps: 100}
    evaluate:
      evaluation: {max_examples: null}

# =============================================================================
# 路线 2：minionerec（Semantic ID：prepare → SFT → GRPO → SID eval）
# =============================================================================
minionerec:
  workflow:
    name: minionerec
    task: semantic_id_generation
    semantic_id:
      method: residual_kmeans
      levels: 3
      codebook_size: 64
      collision_handling: extra_level

  dataset:
    name: movielens_100k
    rating_threshold: 4.0
    split: leave_one_out
    history_max_length: 20
    min_user_interactions: 5
    train_limit: null
    eval_limit: null

  model:
    name: qwen2.5-0.5b-instruct
    checkpoint: Qwen/Qwen2.5-0.5B-Instruct
    dtype: float16
    use_flash_attention: false
    gradient_checkpointing: true

  peft:
    enabled: true
    method: lora
    rank: 16
    alpha: 32
    dropout: 0.05

  prepare:
    semantic_id:
      method: residual_kmeans
      levels: 3
      codebook_size: 64
      collision_handling: extra_level

  sft:
    training:
      stages: [sft]
      batch_size: 2
      gradient_accumulation_steps: 4
      learning_rate: 0.0001
      epochs: 1
      eval_steps: 50
      save_steps: 50
      logging_steps: 10
      max_seq_length: 1024

  grpo:
    training:
      stages: [grpo]
      batch_size: 2
      gradient_accumulation_steps: 1
      learning_rate: 0.000005
      epochs: 1
      eval_steps: 50
      save_steps: 50
      logging_steps: 5
      max_seq_length: 1024
    grpo:
      num_generations: 4
      beta: 0.04
      max_completion_length: 16
      temperature: 0.9
      prefix_credit: 0.1
      invalid_penalty: -0.5
      advantage_normalization: group

  evaluate:
    evaluation:
      top_k: [1, 5, 10]
      max_examples: null
      free_gen_n: 50
      use_upstream_eval: true

  analyze: {}

  smoke:
    dataset:
      history_max_length: 8
      train_per_user: 2
      train_limit: 64
      eval_limit: 16
    peft: {rank: 8, alpha: 16}
    prepare:
      semantic_id: {codebook_size: 64, levels: 3}
    sft:
      training:
        batch_size: 2
        gradient_accumulation_steps: 1
        max_steps: 4
        eval_steps: 4
        save_steps: 4
        logging_steps: 1
        max_seq_length: 512
    grpo:
      training: {max_steps: 4, eval_steps: 4, save_steps: 4, logging_steps: 1, max_seq_length: 512}
      grpo:
        num_generations: 2
        prompts_per_step: 1
        max_completion_length: 8
        max_steps: 4
        learning_rate: 0.000005
    evaluate:
      evaluation: {max_examples: 8, free_gen_n: 4}

  full:
    dataset: {train_limit: null, eval_limit: null}
    sft:
      training: {max_steps: null, logging_steps: 50, eval_steps: 500, save_steps: 500}
    grpo:
      grpo: {max_steps: 100}
    evaluate:
      evaluation: {max_examples: null, free_gen_n: 50}

# =============================================================================
# 路线 3：mllm4rec（多模态：data → Retriever → Ranker）
# =============================================================================
mllm4rec:
  workflow:
    name: mllm4rec
    task: candidate_choice
    modality: multimodal

  # —— 阶段：数据 ——
  data:
    ml100k:
      dataset:
        code: ml-100k
        raw_dir: data/raw/ml-100k
        output_root: data/preprocessed
        min_rating: 0
        min_uc: 5
        min_sc: 5
        seed: 42
      compatibility: {mode: original}
      filtering: {mode: original, iterative_kcore: true}
      tmdb:
        api_key_env: TMDB_API_KEY
        match_mode: original
        image_base_url: https://image.tmdb.org/t/p/original
        timeout_seconds: 30
        retries: 3
        max_workers: 8
        resume: true
      caption:
        model_name_or_path: Salesforce/blip2-opt-2.7b
        device: cuda
        dtype: float16
        mode: original
        batch_size: 1
        resume: true
      serialization:
        save_pickle: true
        save_parquet: true
        atomic_write: true
        create_backup: true
      logging: {level: INFO, log_dir: logs/mllm4rec}

    ml1m:
      dataset:
        code: ml-1m
        raw_dir: data/raw/ml-1m
        output_root: data/preprocessed
        min_rating: 0
        min_uc: 5
        min_sc: 5
        seed: 42
      compatibility: {mode: original}
      filtering: {mode: original, iterative_kcore: true}
      tmdb:
        api_key_env: TMDB_API_KEY
        match_mode: original
        image_base_url: https://image.tmdb.org/t/p/original
        timeout_seconds: 30
        retries: 3
        max_workers: 8
        resume: true
      caption:
        model_name_or_path: Salesforce/blip2-opt-2.7b
        device: cuda
        dtype: float16
        mode: original
        batch_size: 1
        resume: true
      serialization:
        save_pickle: true
        save_parquet: true
        atomic_write: true
        create_backup: true
      logging: {level: INFO, log_dir: logs/mllm4rec}

  # —— 阶段：Retriever ——
  retriever:
    dataset:
      dataset_pkl: data/preprocessed/ml-100k_min_rating0-min_uc5-min_sc5/dataset.pkl
    retriever:
      export_root: experiments/lru/ml-100k
      device: cuda
      seed: 42
      bert_max_len: 200
      bert_hidden_units: 64
      bert_num_blocks: 2
      train_batch_size: 16
      val_batch_size: 16
      test_batch_size: 16
      num_epochs: 500
      val_strategy: iteration
      val_iterations: 500
      early_stopping_patience: 20
      lr: 0.001
      weight_decay: 0.01
      bert_dropout: 0.2
      bert_attn_dropout: 0.2

  # —— 阶段：Ranker ——
  ranker:
    ranker:
      dataset_pkl: data/preprocessed/ml-100k_min_rating0-min_uc5-min_sc5/dataset.pkl
      retrieved_pkl: experiments/lru/ml-100k/retrieved.pkl
      export_root: experiments/ranker/ml-100k
      llm_base_model: Qwen/Qwen2.5-0.5B-Instruct
      llm_base_tokenizer: Qwen/Qwen2.5-0.5B-Instruct
      device: cuda
      dtype: float16
      load_in_4bit: false
      lora_num_epochs: 3
      lora_micro_batch_size: 2
      lora_lr: 0.0001
      llm_negative_sample_size: 19
      llm_max_history: 25

  smoke:
    retriever:
      retriever: {num_epochs: 2}
    ranker:
      ranker: {lora_num_epochs: 1, max_train_steps: 20}

  full: {}

# 可选全局预设（reward=… / evaluation=…）
reward_presets:
  default:
    reward:
      name: default
      components: [exact_match, format_validity]
      weights: {exact_match: 1.0, format_validity: 0.2}
  accuracy:
    reward:
      name: accuracy
      components: [exact_match, format_validity]
      weights: {exact_match: 1.0, format_validity: 0.2}
  bias_aware:
    reward:
      name: bias_aware
      components: [ndcg, popularity_penalty, position_penalty]
      weights: {ndcg: 1.0, popularity_penalty: 0.2, position_penalty: 0.1}
      invalid_penalty: -0.5

evaluation_presets:
  ranking:
    evaluation:
      name: ranking
      top_k: [1, 5, 10]
      metrics: [hr, recall, ndcg, mrr]
  full_bias:
    evaluation:
      name: full_bias
      top_k: [1, 5, 10]
      metrics: [hr, recall, ndcg, mrr]
      bias: [popularity_bias, position_bias, framing_bias, history_bias]
      generation: [sid_validity, semantic_collision, generation_accuracy]

# =============================================================================
# 实验名 → 路线 + 规模 + 阶段（兼容 experiment=smoke_grpo 等旧写法）
# =============================================================================
experiments:
  smoke_grpo:
    workflow: grpo4rec
    scale: smoke
    stages: [sft, grpo, evaluate, analyze]
  smoke_sft:
    workflow: grpo4rec
    scale: smoke
    stages: [sft, evaluate]
  smoke_test:
    workflow: grpo4rec
    scale: smoke
    stages: [sft, grpo, evaluate, analyze, report]
    # prepare 用稍大样本
    overrides:
      dataset: {train_limit: 1000, eval_limit: 200, history_max_length: 20}
  smoke_sid:
    workflow: minionerec
    scale: smoke
    stages: [sft, grpo, evaluate, analyze]
  smoke_probes:
    workflow: grpo4rec
    scale: smoke
    stages: [analyze]
  ablation_reward:
    workflow: grpo4rec
    scale: full
    stages: [grpo, evaluate, analyze, report]
    overrides:
      grpo:
        grpo:
          reward_weights:
            exact_match: 1.0
            format_validity: 0.2
            rank_aware: 0.5
            popularity_penalty: 0.5
