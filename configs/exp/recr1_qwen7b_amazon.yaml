# =============================================================================
# recr1 × Qwen2.5-7B-Instruct × Amazon23
# 只覆盖和 0.5B 版不同的地方，其余全部继承。
#
#     GPUS=0,1,2,3 EXP=recr1_qwen7b_amazon bash run.sh
#
# 显存：7B 全参 bf16 + 优化器状态单卡放得下（B200 180GB）→ SFT/RL 均走 DDP。
#       避开 ZeRO-3 的 NCCL allgather 挂起；4×B200 无 gather 开销。
# =============================================================================

defaults:
  - exp/recr1_qwen05b_amazon
  - model/qwen2.5-7b-instruct

experiment: {name: recr1_qwen7b_amazon}

hardware:
  devices: "0,1,2,3,4,5,6,7"
  precision: bf16          # 7B 用 fp32 不现实；A100/H100 才有 bf16
  strategy: ddp            # 强制 DDP，避开 auto 对 7B 选 fsdp
  gradient_checkpointing: true
  deepspeed: null          # DDP（null）

wandb:
  enabled: true
  mode: online
  project: llm4rec-bias
  entity: dylan-li-dailin-university-of-virginia
  group: recr1_qwen7b_amazon
  tags: [recr1, qwen7b, amazon23]
