# =============================================================================
# minionerec × Qwen2.5-7B-Instruct × Amazon23
# 只覆盖和 0.5B 版不同的地方，其余全部继承。
#
#     DEEPSPEED=zero3 GPUS=0,1,2,3,4,5,6,7 EXP=minionerec_qwen7b_amazon bash run.sh
#
# 显存：7B 全参 fp32 单卡放不下 → SFT 必须 ZeRO-3。
#       RL 阶段本框架走 DDP（ZeRO-3 下 generate 每步 gather 参数会极慢），
#       所以 RL 需要单卡能放下 policy + ref = 2×7B，建议 bf16 + A100-80G。
# =============================================================================

defaults:
  - exp/minionerec_qwen05b_amazon
  - model/qwen2.5-7b-instruct

experiment: {name: minionerec_qwen7b_amazon}

hardware:
  devices: "0,1,2,3,4,5,6,7"
  precision: bf16          # 7B 用 fp32 不现实；A100/H100 才有 bf16
  gradient_checkpointing: true
  deepspeed: zero3         # 只作用于 SFT

wandb:
  group: minionerec_qwen7b_amazon
  tags: [minionerec, qwen7b, amazon23]
