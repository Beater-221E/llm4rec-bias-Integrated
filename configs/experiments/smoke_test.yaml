experiment:
  name: smoke_test
  seed: 42

dataset:
  name: movielens_100k
  rating_threshold: 4.0
  split: leave_one_out
  history_max_length: 20
  candidate_size: 10
  negative_sampling: uniform
  target_position: random
  framing: neutral
  train_limit: 1000
  eval_limit: 200

workflow:
  name: grpo4rec
  task: candidate_choice

model:
  name: qwen2.5-0.5b-instruct
  checkpoint: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float16
  use_flash_attention: false
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  stages:
    - sft
    - grpo
    - evaluate
    - analyze
    - report
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  epochs: 1
  eval_steps: 50
  save_steps: 50
  logging_steps: 5

grpo:
  num_generations: 4
  beta: 0.04
  max_completion_length: 16
  reward_weights:
    exact_match: 1.0
    format_validity: 0.2
    popularity_penalty: 0.0

evaluation:
  top_k:
    - 1
    - 5
    - 10
  use_upstream_eval: true

bias:
  probes:
    - popularity
    - position
    - framing
    - recency

tracking:
  console: true
  jsonl: true
  tensorboard: true
  wandb: false
