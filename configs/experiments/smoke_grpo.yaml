# Tiny SFT → GRPO smoke (candidate choice)
experiment:
  name: smoke_grpo
  seed: 42

dataset:
  name: movielens_100k
  rating_threshold: 4.0
  split: leave_one_out
  history_max_length: 8
  candidate_size: 10
  negative_sampling: uniform
  target_position: random
  framing: neutral
  train_limit: 64
  eval_limit: 32

workflow:
  name: grpo4rec
  task: candidate_choice

model:
  name: qwen2.5-0.5b-instruct
  checkpoint: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float16
  use_flash_attention: false
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  stages:
    - sft
    - grpo
    - evaluate
    - analyze
  batch_size: 1
  prompts_per_step: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  epochs: 1
  max_steps: 4
  eval_steps: 4
  save_steps: 4
  logging_steps: 1
  max_seq_length: 512

grpo:
  num_generations: 2
  prompts_per_step: 1
  beta: 0.04
  max_completion_length: 8
  temperature: 1.0
  top_p: 1.0
  max_steps: 4
  learning_rate: 0.000005
  advantage_normalization: group
  reward_weights:
    exact_match: 1.0
    format_validity: 0.2
    rank_aware: 0.0
    popularity_penalty: 0.0
  invalid_penalty: -0.5

evaluation:
  top_k:
    - 1
    - 5
    - 10
  use_upstream_eval: true

tracking:
  console: true
  jsonl: true
  tensorboard: false
  wandb: false
