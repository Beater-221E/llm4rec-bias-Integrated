# Minimal candidate-choice SFT smoke on ML-100K + Qwen2.5-0.5B-Instruct
experiment:
  name: smoke_sft
  seed: 42

dataset:
  name: movielens_100k
  rating_threshold: 4.0
  split: leave_one_out
  history_max_length: 8
  candidate_size: 10
  negative_sampling: uniform
  target_position: random
  framing: neutral
  train_limit: 128
  eval_limit: 64

workflow:
  name: grpo4rec
  task: candidate_choice

model:
  name: qwen2.5-0.5b-instruct
  checkpoint: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float16
  use_flash_attention: false
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  stages:
    - sft
    - evaluate
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  epochs: 1
  max_steps: 20
  eval_steps: 10
  save_steps: 20
  logging_steps: 5
  max_seq_length: 512

evaluation:
  top_k:
    - 1
    - 5
    - 10
  use_upstream_eval: true

tracking:
  console: true
  jsonl: true
  tensorboard: false
  wandb: false
