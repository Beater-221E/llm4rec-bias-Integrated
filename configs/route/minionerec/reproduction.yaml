# MiniOneRec reference reproduction — does NOT inherit integrated training knobs.
# Pair with route/minionerec/common.yaml (+ data/model layers in the exp file).

mode: reproduction

experiment:
  mode: reproduction

# Intentional scope: algorithm/training-semantic reproduction on the unified
# integrated dataset/split protocol (NOT MiniOneRec upstream CSV preprocessing).
reproduction_scope:
  algorithm: minionerec_reference
  data_protocol: integrated_unified

model:
  sid_token_initialization: reference

# Official MiniOneRec SID (intentional override of sid/rqvae.yaml).
# modes.apply_mode_defaults also forces these when mode=reproduction.
sid:
  implementation: minionerec_reference
  method: rqvae
  levels: 3
  codebook_size: 256
  max_collision_rate: 1.0
  strict_unique: false
  collision_handling: minionerec_sinkhorn_last_level
  rqvae:
    seed: 2024
    pca_dim: null
    layers: [2048, 1024, 512, 256, 128, 64]
    e_dim: 32
    num_emb_list: [256, 256, 256]
    lr: 1.0e-3
    epochs: 10000
    batch_size: 20480
    beta: 0.25
    kmeans_init: true
    sk_epsilons: [0.0, 0.0, 0.0]
    sk_epsilon_last: 0.003
    collision_retry_iters: 20
    eval_step: 50
    warmup_epochs: 50

optimization:
  compile:
    enabled: false
  triton:
    rq_distance_argmin: false

reference:
  repository: AkaliKong/MiniOneRec
  commit: 0c64b955ecb8e3d7a9ae9f1fa88cf938f129b0ed
  launcher: sft.sh->sft.py ; rl.sh->rl.py

train:
  sft:
    # Upstream ConcatDataset(SidSFT, SidItemFeat, FusionSeqRec)
    objectives: [sid_sft, sid_item_feat, fusion_seqrec]
    tasks: [seqrec, title2sid, sid2title]  # ignored in reproduction path
    epochs: 10
    learning_rate: 3.0e-4
    lr_scheduler_type: linear
    warmup_steps: 20
    warmup_ratio: null
    optim: adamw_torch
    logging_steps: 1
    eval_steps: 0.05
    save_steps: 0.05
    load_best_model_at_end: true
    early_stopping_patience: 3
    group_by_length: false
    # Upstream sft.sh: batch_size=1024, micro_batch_size=16
    reference_global_batch_size: 1024
    global_batch_size: 1024
    preferred_per_device_batch_size: 16
    per_device_batch_size: 16
    gradient_accumulation_steps: 8
    max_seq_length: 512
    padding_side: left
    tokenization: raw

  rl:
    algorithm: grpo
    epochs: 2
    eval_steps: 25
    bias_eval_steps: 25
    eval_examples: 256
    logging_steps: 1
    learning_rate: 1.0e-5
    lr_scheduler_type: cosine
    warmup_ratio: 0.03
    max_grad_norm: 0.3
    optim: paged_adamw_32bit
    # Upstream rl.sh: 8 procs x per_device_train_batch=64 x accum=2 → 1024 prompts
    reference_global_batch_size: 1024
    target_global_batch_size: 1024
    global_batch_size: 1024
    per_device_batch_size: 1
    gradient_accumulation_steps: 8
    max_prompt_length: 512
    reference_datasets:
      sid_seq:
        sample: -1
      title_to_sid:
        sample: -1
      seq_title_to_sid:
        sample: 10000
    grpo:
      group_size: 16
      beta: 1.0e-3
      clip_epsilon: 0.2
      temperature: 1.0
      updates_per_rollout: 1
      advantage_normalization: group
      constrained_rollout: true
      beam_search: true
      do_sample: true
      length_penalty: 0.0
      sync_ref_model: true
      ref_model_mixup_alpha: 0.6
      ref_model_sync_steps: 512
      dapo: false
      dynamic_sampling: false
    reward:
      type: ranking
      implementation: minionerec_reference
      invalid_penalty: -1.0
