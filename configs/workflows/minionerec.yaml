workflow:
  name: minionerec
  task: semantic_id_generation
  stages:
    - prepare_data
    - encode_item_text
    - build_semantic_ids
    - build_sid_dataset
    - sft
    - merge_adapter
    - recommendation_rl
    - constrained_evaluation
    - bias_probes
    - report
  semantic_id:
    method: residual_kmeans
    levels: 3
    codebook_size: 64
    collision_handling: extra_level
