# MLLM4Rec official-compatible MovieLens config.
# dataset.code ml-100k => GroupLens ml-latest-small (ratings.csv / movies.csv).

dataset:
  code: ml-100k
  raw_dir: data/raw/ml-100k
  output_root: data/preprocessed
  min_rating: 0
  min_uc: 5
  min_sc: 5
  seed: 42

compatibility:
  mode: original

filtering:
  mode: original
  # iterative_kcore only meaningful when filtering.mode=robust
  iterative_kcore: true

tmdb:
  api_key_env: TMDB_API_KEY
  match_mode: original
  image_base_url: https://image.tmdb.org/t/p/original
  timeout_seconds: 30
  retries: 3
  max_workers: 8
  resume: true

caption:
  model_name_or_path: Salesforce/blip2-opt-2.7b
  device: cuda
  dtype: float16
  mode: original
  batch_size: 1
  resume: true

serialization:
  save_pickle: true
  save_parquet: true
  atomic_write: true
  create_backup: true

logging:
  level: INFO
  log_dir: logs/mllm4rec
