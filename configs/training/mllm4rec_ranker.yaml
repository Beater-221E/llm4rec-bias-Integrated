# Multimodal LLM Ranker (after retrieved.pkl exists).
# V100: dtype float16; use a small Instruct model for smoke.

ranker:
  dataset_pkl: data/preprocessed/ml-100k_min_rating0-min_uc5-min_sc5/dataset.pkl
  retrieved_pkl: experiments/lru/ml-100k/retrieved.pkl
  export_root: experiments/ranker/ml-100k
  llm_base_model: Qwen/Qwen2.5-0.5B-Instruct
  llm_base_tokenizer: Qwen/Qwen2.5-0.5B-Instruct
  device: cuda
  dtype: float16
  load_in_4bit: false
  lora_num_epochs: 3
  lora_micro_batch_size: 2
  lora_lr: 0.0001
  llm_negative_sample_size: 19
  llm_max_history: 25
