training:
  name: grpo_lora
  stages:
    - grpo
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  epochs: 1
  eval_steps: 50
  save_steps: 50
  logging_steps: 5

grpo:
  num_generations: 8
  beta: 0.04
  max_prompt_length: 1024
  max_completion_length: 64
  temperature: 1.0
  top_p: 1.0
  advantage_normalization: group
  reward_weights:
    exact_match: 1.0
    format_validity: 0.2
    rank_aware: 0.5
    semantic_prefix: 0.0
    popularity_penalty: 0.0
